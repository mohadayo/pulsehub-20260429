services:
  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ANALYTICS_URL=http://analytics:8081
      - NOTIFIER_URL=http://notifier:8082
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      analytics:
        condition: service_started
      notifier:
        condition: service_started

  analytics:
    build: ./analytics
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  notifier:
    build: ./notifier
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - LOG_LEVEL=${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 3
